name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    # Runs on every push, scans history + working tree for committed secrets.
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so leaked secrets in old commits are caught
      - name: Scan for secrets
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: backend (migrations, pytest, ruff)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ENVIRONMENT: dev
      # Throwaway CI-only secret; never reused outside a runner.
      JWT_SECRET: ci-only-not-a-real-secret-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgresql://inventory:inventory@localhost:5432/inventory_test
      POOL_MIN_SIZE: 1
      POOL_MAX_SIZE: 4

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        run: |
          PGPASSWORD=inventory psql -h localhost -U inventory -d inventory \
            -c "CREATE DATABASE inventory_test;"

      - name: Apply migrations
        # Proves the SQL applies from a genuinely empty database every run.
        run: python scripts/migrate.py

      - name: Ruff
        run: ruff check app main.py scripts tests

      - name: Type errors (ratchet)
        # mypy is not clean. This fails only if the count rises above the
        # recorded baseline, so the debt cannot silently grow.
        run: python scripts/mypy_ratchet.py

      - name: Pytest
        run: pytest tests -q

  frontend:
    name: frontend (npm ci, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        # `npm run build` and a running dev server cannot share .next; CI has
        # no dev server so this is safe here.